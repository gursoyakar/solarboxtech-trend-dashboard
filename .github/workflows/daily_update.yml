name: Daily YouTube RSS Dashboard Update

on:
  schedule:
    - cron: "0 5 * * *" # 08:00 Europe/Istanbul (UTC+3)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch free YouTube RSS feeds
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          feeds = [
              ("Two Bit da Vinci", "UCEgYhf84VjXDz-W7a9-rdCQ"),
              ("Undecided with Matt Ferrell", "UCjtUS7-SZTi6pXjUbzGHQCg"),
              ("Kanal 3", "UCJYDHsZ0aYyjz5Csi_aZ2Eg"),
              ("Kanal 4", "UC8NjzyxPby9k0oIc1yL8xRg"),
              ("Ziroth Tech", "UCezOhPRojzE_Du7XQodCKxQ"),
          ]
          atom = "{http://www.w3.org/2005/Atom}"
          yt = "{http://www.youtube.com/xml/schemas/2015}"
          videos = []

          for channel_name, channel_id in feeds:
              url = f"https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}"
              request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  feed = ET.fromstring(response.read())
              found = 0
              for entry in feed.findall(atom + "entry"):
                  title = entry.findtext(atom + "title", default="").strip()
                  video_id = entry.findtext(yt + "videoId", default="").strip()
                  published = entry.findtext(atom + "published", default="").strip()
                  if title and video_id:
                      videos.append({
                          "channel": channel_name,
                          "title": title,
                          "url": f"https://www.youtube.com/watch?v={video_id}",
                          "published": published,
                      })
                      found += 1
              print(f"{channel_name}: {found} videos")
              if not found:
                  raise RuntimeError(f"No RSS videos returned for {channel_name}")

          videos.sort(key=lambda video: video["published"], reverse=True)
          payload = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "source": "YouTube public RSS feeds; view and subscriber counts are not included",
              "videos": videos,
          }
          with open("rss_data.json", "w", encoding="utf-8") as output:
              json.dump(payload, output, ensure_ascii=False, indent=2)
          PY

      - name: Commit dashboard data
        run: |
          git config user.name "SolarBoxtech Bot"
          git config user.email "bot@solarboxtech.com"
          git add rss_data.json
          if git diff --cached --quiet; then
            echo "RSS data unchanged"
          else
            git commit -m "Update dashboard from free YouTube RSS"
            git push
          fi
