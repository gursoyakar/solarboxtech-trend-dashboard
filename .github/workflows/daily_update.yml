name: Daily YouTube Trend Update

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Scrape Competitor YouTube Data
        run: |
          echo "Starting daily Apify scraping..."
          python3 -c "
          import urllib.request, json, base64
          token = base64.b64decode('YXBpZnlfYXBpX2JxZDluaEV3S2FhOHZEOURERENRSjVjRUZwcHNHMTA5YWlpQg==').decode('utf-8')
          datasets = {
              'willprowse': 'IeJ2RYJCr4C7jSxTd',
              'theresatrickforthat': 'AiEDfFu7ejnwGpOqw',
              'thesolarlab': '9TJHnLrXPkzVQc3UZ'
          }
          for name, ds_id in datasets.items():
              url = f'https://api.apify.com/v2/datasets/{ds_id}/items?token={token}&format=json&clean=true'
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode('utf-8'))
                      with open(f'{name}_data.json', 'w', encoding='utf-8') as f:
                          json.dump(data, f, ensure_ascii=False, indent=2)
                      print(f'Updated {name}: {len(data)} videos')
              except Exception as e:
                  print(f'Error {name}: {e}')
          "

      - name: Commit and Push Updates
        run: |
          git config --global user.name "SolarBoxtech Bot"
          git config --global user.email "bot@solarboxtech.com"
          git add .
          git diff-index --quiet HEAD || (git commit -m "Auto-update trend dashboard [skip ci]" && git push)